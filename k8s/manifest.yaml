# Kubernetes: Service, Deployment, Ingress. One namespace is assumed; edit `namespace` and the
# hostname before applying. Lists are JSON strings, exactly as `.env` holds them.

# -------------------------------------------------
# 1. Service -- makes the pod reachable inside the cluster
# -------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  # namespace: mcp
spec:
  selector:
    app: mcp-server            # must match the Deployment label
  ports:
    - protocol: TCP
      port: 80                 # port exposed inside the cluster
      targetPort: 8000         # port the container actually listens on
  type: ClusterIP              # reachable only from inside the cluster

---
# -------------------------------------------------
# 2. Deployment -- runs the container
# -------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  # namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: mcpsquelette:latest   # built locally, or push to your registry first
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000      # matches Service.targetPort
          env:
            # Must contain the hostname the Ingress routes, or host-origin protection rejects
            # every request.
            - name: ALLOWED_HOSTS
              value: '["mcp.example.com"]'
            # No browser client calls this server, so no cross-origin site is allowed.
            - name: ALLOWED_ORIGINS
              value: '[]'
            # The Ingress controller reaches the pod from a cluster IP that changes, so the
            # forwarded caller address is believed from any peer. Uvicorn otherwise trusts only
            # 127.0.0.1, sees every request as coming from the Ingress, and rate limits every
            # caller as one. Keep the pod reachable only through the Ingress.
            - name: TRUSTED_PROXY_HOSTS
              value: '["*"]'
          # The Dockerfile healthcheck is honoured by the kubelet; these are the probe timings.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            limits:
              cpu: 1
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "128Mi"

---
# -------------------------------------------------
# 3. Ingress -- exposes the Service outside the cluster
# -------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
  # namespace: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: mcp.example.com          # must also be in ALLOWED_HOSTS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server-service   # matches Service.metadata.name
                port:
                  number: 80               # matches Service.port
