
# -------------------------------------------------
# 1️⃣ Service – makes the pod reachable inside the cluster
# -------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
  # optional: namespace: my‑namespace
spec:
  selector:
    app: mcp_server            # <-- must match the Deployment label
  ports:
    - protocol: TCP
      port: 80                    # the port exposed inside the cluster
      targetPort: 8000            # the port the container actually listens on
  type: ClusterIP                # default – reachable only from inside the cluster

---
# -------------------------------------------------
# 2️⃣ Deployment – runs the container
# -------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment-server
  # Uncomment the line below to deploy to a specific namespace
  # namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp_server
  template:
    metadata:
      labels:
        app: mcp_server
    spec:
      containers:
        - name: mcp-sirene-container
          image: x/mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000          # matches Service.targetPort
          env:
          - name: ALLOWED_HOSTS
            value: '["mcpserver.lab.sspcloud.fr"]'
          # No browser client calls this server today, so no cross-origin site is allowed.
          - name: ALLOWED_ORIGINS
            value: '[]'
          # The Ingress controller reaches the pod from a cluster IP that changes, so the
          # forwarded caller address is believed from any peer. Uvicorn otherwise trusts only
          # 127.0.0.1, sees every request as coming from the Ingress, and rate limits all
          # callers as one. Keep the pod reachable only through the Ingress.
          - name: TRUSTED_PROXY_HOSTS
            value: '["*"]'
          # Optional resources block – adjust as needed
          resources:
            limits:
              cpu: 1
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "128Mi"

---
# -------------------------------------------------
# 3️⃣ Ingress – exposes the Service outside the cluster
# -------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-ingress
  # optional: namespace: my‑namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: mcpserver.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-server-service   # matches Service.metadata.name
                port:
                  number: 80               # matches Service.port # kubectl rollout restart deployment/backend-deployment